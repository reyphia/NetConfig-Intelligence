version 15.7
hostname BRANCH-RTR
service password-encryption
username engineer privilege 15 secret 9 $9$SANITIZED_HASH
interface GigabitEthernet0/0
 description LAN uplink
 ip address 10.10.10.1 255.255.255.0
 no shutdown
