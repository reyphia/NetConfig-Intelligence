! Sanitized demo IOS-XE edge router configuration for NetConfig Intelligence.
! All credentials below are fake/sanitized demo values - do not reuse them.
version 17.3
service timestamps debug datetime msec
service timestamps log datetime msec
platform qfp utilization monitor load 80
boot-start-marker
boot-end-marker
!
hostname EDGE-XE01
!
aaa new-model
!
enable secret 9 $9$SANITIZED$XEDEMO.HASH.ONLY
!
username netadmin privilege 15 secret 9 $9$SANITIZED$XEDEMO.HASH.TWO
!
ip domain name lab.internal
ip ssh version 2
!
license boot level network-advantage addon dna-advantage
!
interface GigabitEthernet1
 description WAN uplink to ISP
 ip address 198.51.100.10 255.255.255.252
 ip nat outside
 ip access-group WAN-IN in
 no shutdown
!
interface GigabitEthernet2
 description LAN trunk to core switch
 ip address 10.30.0.1 255.255.255.0
 ip nat inside
 no shutdown
!
interface GigabitEthernet3
 shutdown
!
router ospf 10
 network 10.30.0.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 198.51.100.9
!
ip access-list extended WAN-IN
 permit tcp any host 198.51.100.10 eq 443
 permit tcp any host 198.51.100.10 eq 22
 deny ip any any
!
access-list 1 permit 10.30.0.0 0.0.0.255
ip nat inside source list 1 interface GigabitEthernet1 overload
!
ip dhcp pool USERS-POOL
 network 10.30.0.0 255.255.255.0
 default-router 10.30.0.1
 dns-server 10.30.0.53
!
snmp-server community NETCONFIG_DEMO_RO RO
!
banner motd ^C Authorized access only. All activity is logged. ^C
!
ip http secure-server
!
line con 0
line vty 0 4
 transport input ssh
 access-class WAN-IN in
!
end
